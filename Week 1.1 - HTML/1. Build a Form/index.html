<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Build a Form</title>
</head>
<body>
	<form method="submit" action="/login/" >
		<label for="emailInput">Email</label>
		<input name="email" id="emailInput" placeholder="example@granicus.com" aria-label="email" type="email" required />
		<label for="passwordInput">Password</label>
		<input name="password" id="passwordInput" aria-label="password" type="password" required />
		<input type="submit"/>
	</form>

</body>
</html>
