<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Data Fetching</title>
</head>
<body>
	
	<ul class="movies"></ul>
	
	<script>
		// Add your code here

		let createElement = ({title}) => {
			return (
				`<li>${title}</li>`
			);
		}

		const doStuf = async () => {
			const resp = await fetch('https://ghibliapi.vercel.app/films');
			const data = await resp.json();
			let element = document.querySelector('.movies');
			document.querySelector('.movies').innerHTML = data.map(createElement).join('')
		}
		doStuf()
	</script>

</body>
</html>
